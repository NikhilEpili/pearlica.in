<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact request</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
<tr><td align="center">
<table width="520" cellpadding="0" cellspacing="0" style="background:#fff;border:1px solid #e0e0e0;">
<tr>
<td style="background:#0a0a0a;padding:24px 28px;text-align:center;">
<img src="{{site_url}}/assets/images/footer_white-logo_trans-bg.png" alt="Pearlica" width="100" style="display:block;margin:0 auto;">
<p style="margin:12px 0 0;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.45);">Inbound</p>
</td>
</tr>
<tr>
<td style="padding:28px 28px 0;">
<p style="margin:0 0 6px;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#888;">Contact</p>
<h1 style="margin:0 0 8px;font-family:Georgia,serif;font-size:24px;font-weight:400;color:#0a0a0a;">New contact request</h1>
<p style="margin:0 0 20px;font-size:12px;color:#aaa;">ID #{{contact_id}} · pearlica.in/contact</p>
<table width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #e8e8e8;"><tr><td></td></tr></table>
</td>
</tr>
<tr>
<td style="padding:24px 28px 0;">
<table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:16px;">
<tr>
<td style="border-bottom:1px solid #e8e8e8;padding-bottom:12px;width:50%;padding-right:12px;vertical-align:top;">
<p style="margin:0 0 4px;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#aaa;">Name</p>
<p style="margin:0;font-family:Georgia,serif;font-size:16px;color:#0a0a0a;">{{full_name}}</p>
</td>
<td style="border-bottom:1px solid #e8e8e8;padding-bottom:12px;width:50%;padding-left:12px;vertical-align:top;">
<p style="margin:0 0 4px;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#aaa;">Email</p>
<p style="margin:0;font-size:13px;color:#0a0a0a;">{{email}}</p>
</td>
</tr>
</table>
<table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:16px;">
<tr>
<td style="border-bottom:1px solid #e8e8e8;padding-bottom:12px;width:50%;padding-right:12px;">
<p style="margin:0 0 4px;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#aaa;">Phone</p>
<p style="margin:0;font-size:13px;color:#444;">{{phone_display}}</p>
</td>
<td style="border-bottom:1px solid #e8e8e8;padding-bottom:12px;width:50%;padding-left:12px;">
<p style="margin:0 0 4px;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#aaa;">Order ref.</p>
<p style="margin:0;font-size:13px;color:#444;">{{order_display}}</p>
</td>
</tr>
</table>
<p style="margin:0 0 8px;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#aaa;">Subject</p>
<p style="margin:0 0 20px;"><span style="display:inline-block;border:1px solid #d4d4d4;padding:4px 12px;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#0a0a0a;">{{subject_badge}}</span></p>
</td>
</tr>
<tr>
<td style="padding:0 28px 24px;">
<p style="margin:0 0 10px;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#888;">Message</p>
<table width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e8e8e8;"><tr><td style="padding:18px 20px;font-size:13px;line-height:1.8;color:#444;">{{message_html}}</td></tr></table>
</td>
</tr>
<tr>
<td style="padding:0 28px 28px;">
<table cellpadding="0" cellspacing="0"><tr><td style="background:#0a0a0a;">
<a href="{{reply_href}}" style="display:inline-block;padding:14px 28px;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#fff;text-decoration:none;">Reply to sender</a>
</td></tr></table>
</td>
</tr>
<tr>
<td style="border-top:1px solid #e8e8e8;padding:16px 28px;">
<p style="margin:0;font-size:10px;color:#bbb;">Submitted {{submitted_on}}</p>
</td>
</tr>
</table>
</td></tr>
</table>
</body>
</html>
