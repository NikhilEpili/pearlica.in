; Reel videos are uploaded through the admin (uploads/reels), so the defaults of
; 2M/8M are far too small and cause PHP to discard the whole POST body.
; Applies on PHP-FPM / CGI hosts such as Hostinger. On Apache with mod_php use
; .htaccess (php_value ...) or hPanel > PHP Configuration instead.
upload_max_filesize = 64M
post_max_size = 80M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
